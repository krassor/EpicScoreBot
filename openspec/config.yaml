schema: spec-driven

context: |
  EpicScoreBot — сервис скоринга эпиков/рисков с Telegram-ботом и веб-Gantt.
  Backend: Go 1.26, chi/v5, sqlx+lib/pq (PostgreSQL), cleanenv, go-telegram/bot,
  revrost/go-openrouter, nativebpm/gotenberg (PDF). Слои: transport → services →
  repositories (нижние не знают о верхних), доменные модели — internal/models/domain/.
  Frontend: Vanilla JS/CSS/HTML (web/gantt/), без фреймворков.
  Формат ошибок HTTP API стандартизирован во всём проекте:
  { "error": { "code": "...", "message": "..." } } — не отклоняться.
  Комментарии и коммиты — русский, идентификаторы в коде — английский.
  Новые зависимости не добавлять без обоснования и одобрения пользователя.
  Подробности по областям: .agents/tasks/task_backend.md, task_frontend.md,
  task_devops.md, task_qa.md.

  Специализированные субагенты проекта (см. .claude/agents/*.md) — при
  реализации задач делегируй им, а не пиши код за них напрямую:
  - backend (.claude/agents/backend.md) — Go-бэкенд: HTTP API (chi),
    PostgreSQL (sqlx), скоринг, Telegram-бот, миграции (internal/, app/, go.mod)
  - frontend (.claude/agents/frontend.md) — веб-интерфейс Gantt/админ-панели,
    Vanilla JS/CSS/HTML (web/gantt/)
  - ux (.claude/agents/ux.md) — UX-ревью веб-интерфейса: информационная
    архитектура, состояния экранов, доступность, консистентность дизайн-системы.
    Формирует постановку задачи для frontend, код не пишет — реализует frontend
  - devops (.claude/agents/devops.md) — Docker/docker-compose, CI/CD, деплой,
    бэкапы, мониторинг (Dockerfile, docker-compose.yml, scripts/, .github/workflows/)
  - qa (.claude/agents/qa.md) — тестирование и покрытие кода
  Изменения, затрагивающие несколько субагентов (новый API-эндпоинт, новая
  сущность, изменение схемы БД), требуют явного подтверждения пользователя
  перед реализацией, даже если планирование уже завершено.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - Явно указывай затронутые слои (transport/services/repositories) и области
      (backend/frontend/devops/qa), чтобы было понятно, каких субагентов задействовать
    - Изменение формата ошибок API — отдельное архитектурное решение, требует
      явного согласования, не делать по умолчанию
  tasks:
    - Группируй задачи по областям (backend/ux/frontend/devops/qa) в порядке,
      удобном для делегирования
    - Если change затрагивает веб-интерфейс (web/gantt/ — разметка, стили,
      поведение UI), выделяй UX-ревью в отдельную секцию непосредственно перед
      frontend-секцией — её выполняет субагент ux, а frontend реализует по
      сформированной им постановке

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - Секции tasks.md сгруппированы по областям (backend/ux/frontend/devops/qa,
        см. rules.tasks) — делегируй каждую секцию соответствующему субагенту
        через Agent tool вместо реализации backend/frontend/devops/qa-кода
        напрямую в координаторской сессии
      - "Соблюдай порядок с учётом зависимостей между областями: backend перед frontend, если frontend использует новые/изменённые HTTP-эндпоинты; qa — последней секцией, после того как остальные затронутые области реализованы"
      - "Если в tasks.md есть frontend-секция, затрагивающая разметку, стили или поведение UI, сначала вызови субагента ux: он делает UX-ревью затронутых экранов и формирует постановку (что менять, в каких файлах, критерии приёмки). Постановку ux передай субагенту frontend как задание на реализацию — код по UX-находкам пишет только frontend. Итоговый порядок делегирования: backend → ux → frontend → qa"
      - "Субагент ux работает read-only (без Edit/Write). Если он сообщает о находке, требующей изменения продуктовых требований, а не подачи, — не реализуй её молча, вынеси вопрос пользователю"
      - Изменения, затрагивающие несколько субагентов (новый API-эндпоинт,
        новая сущность, изменение схемы БД), требуют явного подтверждения
        пользователя перед стартом реализации, даже если планирование уже
        завершено
