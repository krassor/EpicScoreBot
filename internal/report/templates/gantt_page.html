<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <title>Диаграмма Ганта — {{.TeamName}}</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Лист печатается собственным размером, вычисленным в Go (см.
       report.GanttPageSize) и переданным конвертации отдельным
       PaperSize(ширина, высота) — см. generator.go, tasks.md §3.2. Разметка
       здесь намеренно не задаёт свои поля/размер страницы: и то, и другое
       уже учтено внутри самого SVG (см. gantt_svg.go), а margins запроса
       конвертации выставлены в 0, чтобы не удваивать отступы. */
    svg {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>

<body>
  {{.DiagramSVG}}
</body>

</html>
